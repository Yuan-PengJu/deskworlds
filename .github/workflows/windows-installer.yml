# Builds the Windows installer from source and, for a tag like windows-v1.1.0, publishes
# it on the Releases page with its SHA-256 checksum. The installer is never committed to
# the repository: anyone can rebuild it from the tagged source with `npm run dist`.
name: Windows installer

on:
  push:
    tags: ['windows-v*']
  pull_request:
    paths: ['windows/**', 'scenes/**', 'vendor/**', 'ui/**', '.github/workflows/windows-installer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The build runs on Linux: makensis and every download work the same there, and
    # Linux runners start faster. Nothing in it depends on building on Windows.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      # @electron/get keeps the Windows runtime here between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ hashFiles('windows/package-lock.json') }}

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - run: npm ci
      - run: npm run check
      - run: npm run dist

      - name: Checksum
        working-directory: windows/dist
        run: sha256sum Deskworlds-Setup-*.exe | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: deskworlds-windows-installer
          path: |
            windows/dist/Deskworlds-Setup-*.exe
            windows/dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: ubuntu-24.04
    # Only this job can write, and only to create the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deskworlds-windows-installer

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Deskworlds-Setup-*.exe SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Deskworlds for Windows ${GITHUB_REF_NAME#windows-v}" \
            --generate-notes
